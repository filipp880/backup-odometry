services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tramdb
      POSTGRES_USER: tram
      POSTGRES_PASSWORD: tram
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tram -d tramdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      STORAGE: db
      DATABASE_URL: postgresql+psycopg2://tram:tram@postgres:5432/tramdb
      JWT_SECRET: change-me-in-prod-32bytes-minimum
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
