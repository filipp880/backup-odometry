server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the client calls /api/... without a hardcoded host, so a
    # single port serves both the SPA and the backend. The name "backend" is the
    # docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA routing: every client-side route (e.g. /runs/1/trip) serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
